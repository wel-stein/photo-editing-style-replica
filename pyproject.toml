[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photo_style_ai"
version = "0.1.0"
description = "Learn a personal photo editing style from before/after pairs and apply it (LUT export included)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "wel-stein" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "Pillow>=10.0",
    "opencv-python>=4.9",
    "rawpy>=0.19",
    "colour-science>=0.4.4",
    "scikit-image>=0.22",
    "scikit-learn>=1.4",
    "gradio>=4.0",
    "loguru>=0.7",
    "joblib>=1.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[project.scripts]
photo-style-ai = "photo_style.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["photo_style*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
